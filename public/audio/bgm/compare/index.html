<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒場 BGM 聞き比べ</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f3ee; --fg:#222; --card:#fff; --line:#d8d2c8; --on:#8a5a1f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --fg:#eee; --card:#262420; --line:#3b3832; --on:#e0a85a; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0 0 12px; font-size:14px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin:0 0 10px; }
  .row b { display:block; margin-bottom:8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button { flex:1 1 40%; min-height:44px; font-size:15px; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; }
  button.on { border-color:var(--on); color:var(--on); font-weight:bold; }
  #stop { width:100%; margin-top:6px; }
  #status { font-size:13px; min-height:1.6em; }
</style>
</head>
<body>
<h1>酒場 BGM 聞き比べ（MUSIC-BGM-TAVERN-003）</h1>
<p>修正前（v5.70.0）と修正後（v5.71.0）を、ゲームと同じ方法（約 48 秒の 1 周を繰り返す）で鳴らします。
修正前は 8 拍ごと（約 4.8 秒ごと）に、どの楽器も伸びていない 1 拍がありました（剣士・魔法使いの段で目立つ）。
再生は「途切れていた所」の約 2 秒前（2.2 秒の位置）から始まります。</p>
<div id="list"></div>
<button id="stop">停止</button>
<p id="status"></p>
<script>
  const STAGES = [['swordsman', '1 剣士加入'], ['mage', '2 魔法使い加入'], ['archer', '3 弓師加入'],
                  ['thief', '4 盗賊加入'], ['shadow', '5 影の旅人加入'], ['complete', '6 完成版']];
  const FILE = (ver, i, s) => (ver === 'before' ? 'v5_70/' : '../') + `tavern-${i + 1}-${s}.mp3`;
  const LOOP_START = 1, LOOP_END = 48.766667, BLEND = 0.03, GAIN = 0.35, FROM = 2.2;
  let ctx = null, cur = null, gen = 0;   // gen: 読み込み中に別のボタン(同じボタン)を押したら、前の読み込みは鳴らさない
  const cache = new Map();
  const status = t => { document.getElementById('status').textContent = t; };
  function loop(decoded){   // src/audio/audio.js の makeLoopBuffer と同じ
    const rate = decoded.sampleRate, s = Math.round(LOOP_START * rate), n = Math.round((LOOP_END - LOOP_START) * rate);
    const blend = Math.min(Math.round(BLEND * rate), decoded.length - (s + n));
    const out = ctx.createBuffer(decoded.numberOfChannels, n, rate);
    for (let c = 0; c < decoded.numberOfChannels; c++) {
      const x = decoded.getChannelData(c), y = out.getChannelData(c);
      y.set(x.subarray(s, s + n));
      for (let i = 0; i < blend; i++) { const w = i / blend; y[i] = x[s + n + i] * (1 - w) + x[s + i] * w; }
    }
    return out;
  }
  async function load(url){
    if (!cache.has(url)) cache.set(url, fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(d => new Promise((ok, ng) => ctx.decodeAudioData(d, ok, ng))).then(loop));
    return cache.get(url);
  }
  function stop(){
    gen++;
    if (cur) { try { cur.src.stop(); } catch (e) {} cur = null; }
    document.querySelectorAll('button.on').forEach(b => b.classList.remove('on'));
  }
  async function play(btn, url, label){
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    stop();
    const my = gen;
    btn.classList.add('on');
    status(`読み込み中: ${label}`);
    try {
      const buf = await load(url);
      if (my !== gen) return;
      const g = ctx.createGain(); g.gain.value = GAIN; g.connect(ctx.destination);
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(g);
      src.start(ctx.currentTime + 0.05, FROM);
      cur = { src };
      status(`再生中: ${label}`);
    } catch (e) { status(`読めませんでした: ${url}（${e.message || e}）`); btn.classList.remove('on'); }
  }
  const list = document.getElementById('list');
  STAGES.forEach(([s, name], i) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<b>${name}</b><div class="btns"></div>`;
    for (const [ver, txt] of [['before', '修正前 v5.70'], ['after', '修正後 v5.71']]) {
      const b = document.createElement('button'); b.textContent = txt;
      b.onclick = () => play(b, FILE(ver, i, s), `${name}・${txt}`);
      row.querySelector('.btns').appendChild(b);
    }
    list.appendChild(row);
  });
  document.getElementById('stop').onclick = () => { stop(); status(''); };
</script>
</body>
</html>
