name: Test

# deploy.yml (main への push) とは役割を分ける。
# main への通常 push では実行しない。deploy.yml の build と二重実行になるため。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR(ブランチ)へ続けて push すると、以前は push ごとに 1.5〜3 時間の E2E が並んで走っていた。
# 結果を見るのは最新の commit だけなので、古い run は取り消す(CI-001)。最新の commit は必ず最後まで
# 検証される(取り消された commit の変更は最新の commit に含まれている)
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # playwright.config.js の webServer が npm run dev を自動起動し、
      # headless + SwiftShader で実行する。CI 側で設定を上書きしない。
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm test

      # 失敗した時の手がかり(error-context.md・スクリーンショット等)を残す。以前は run の
      # ログの末尾しか残らず、CI だけで落ちる原因を後から調べられなかった(CI-001)
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # PR のプレビュー(DEV-PREVIEW-001)を、読むだけの権限で組めるか確かめる。公開はしない
  # (公開は main 側の deploy.yml が pull_request_target で行う)。組んだサイトは成果物として 3 日残す
  # (プレビューが公開できない時の代わり。iPhone では開きにくいので、ふだんは deploy.yml のプレビューを使う)
  preview-site:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build main-style dist and this PR's preview, assemble the Pages site
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          npm run build
          PREVIEW_PR="$PR" PREVIEW_SHA="$HEAD_SHA" npx vite build --base "/-ARPG-/pr/$PR/" --outDir ".previews/pr-$PR" --emptyOutDir
          node -e '
            const fs = require("fs");
            const pr = Number(process.env.PR);
            fs.writeFileSync("manifest.json", JSON.stringify({ owner: process.env.OWNER, mainDist: "dist", out: "site",
              runUrl: process.env.RUN_URL, builtAt: new Date().toISOString(),
              previews: [{ number: pr, sha: process.env.HEAD_SHA, title: "this PR", dist: ".previews/pr-" + pr, status: "ok" }] }));'
          node scripts/pages-site.mjs manifest.json
          node scripts/verify-preview-site.mjs site "$PR" "$HEAD_SHA"

      - name: Upload the assembled site
        uses: actions/upload-artifact@v4
        with:
          name: pages-site-pr-${{ github.event.pull_request.number }}
          path: site
          retention-days: 3
