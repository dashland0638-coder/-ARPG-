name: Deploy to GitHub Pages (main + PR previews)

# GitHub Pages(Actions から公開)は公開のたびにサイト全体を置き換える。main の公開版(/-ARPG-/)と、
# 開いている PR のプレビュー(/-ARPG-/pr/<N>/)を毎回まとめて組んで公開する(DEV-PREVIEW-001)。
#   - main へ push                       … main の公開版を更新(プレビューも載せ直す)
#   - PR Preview(preview.yml)が終わった … その PR のプレビューを載せる(失敗も「失敗しました」として載せる)
#   - PR を閉じた                         … 載せ直す(閉じた PR のプレビューは消える)
#
# 安全のための約束(.ai/reports/DEV-PREVIEW-001-report.md §4):
#   - このワークフローは PR のコードを一切動かさない。checkout は main(既定のブランチ)だけ、資格情報は残さない
#   - PR のプレビューは preview.yml(pull_request・読むだけ)が組んだ成果物を「データとして」取ってくる
#     (scripts/collect-previews.cjs)。PR の番号・最新 commit は API の値、成果物は PR の最新 commit の実行のものだけ。
#     展開して検査(scripts/verify-preview-site.mjs)に通ったものだけを pr/<N>/ に置く
#   - fork の PR は載せない。fork の PR がきっかけの実行は何もせず、公開の順番待ちにも入らない
#   - 公開(pages / id-token の書き込み)は deploy ジョブだけ。PR へのコメントは comment ジョブだけ
#   - main の公開版は main のコードからだけ組む。PR のプレビューが取れなくても main の公開は止めない
#   - プレビューのセーブ・設定は main の公開版と別のキー(src/core/dev-preview.js)
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [PR Preview]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

# 公開は 1 本ずつ。走っている公開は取り消さない(PR の更新が続いても main の公開が止まらない)。待っている実行は
# GitHub が最新の 1 つだけ残す。どの実行もその時点のすべての PR の最新の状態を組むので、古い状態で上書きしない。
# fork の PR がきっかけの実行は別の group にして、待っている公開を押し出さない
concurrency:
  group: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository) || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)) && format('pages-skip-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ !((github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository) || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      summary: ${{ steps.site.outputs.summary }}
      trigger_pr: ${{ steps.collect.outputs.trigger_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 版表記は取り出した main の commit(workflow_run・pull_request_target の GITHUB_SHA とずれないように)
      - name: Build main
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build
      # 失敗しても main の公開は続ける(プレビューは載らない)
      - name: Collect PR previews (artifacts of preview.yml, as data)
        id: collect
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TRIGGER_PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || '' }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          result-encoding: json
          script: |
            const { collectPreviews } = require('./scripts/collect-previews.cjs');
            const r = await collectPreviews({ github, owner: context.repo.owner, repo: context.repo.repo, outDir: 'incoming',
              triggerPr: process.env.TRIGGER_PR, triggerSha: process.env.TRIGGER_SHA, log: core });
            core.setOutput('trigger_pr', r.triggerPr || '');
            return r;
      - name: Assemble site
        id: site
        env:
          PREVIEWS: ${{ steps.collect.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p incoming
          node scripts/assemble-pages.mjs dist incoming site
          echo "summary=$(node -e 'process.stdout.write(JSON.stringify(require("./site/pr/previews.json")))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # PR に「テスト版を開く」のコメントを 1 つだけ置き、公開のたびに書き換える。URL は公開した page_url から作り、
  # 公開されたプレビューの preview.json の commit が合うことを確かめてから「開けます」と書く
  comment:
    needs: [assemble, deploy]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.assemble.outputs.trigger_pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          SUMMARY: ${{ needs.assemble.outputs.summary }}
          TRIGGER_PR: ${{ needs.assemble.outputs.trigger_pr }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CLOSED: ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- dev-preview -->';
            const pr = Number(process.env.TRIGGER_PR);
            const { owner, repo } = context.repo;
            let summary = [];
            try { summary = JSON.parse(process.env.SUMMARY || '[]'); } catch (e) {}
            const mine = summary.find(p => p.pr === pr);
            const deployed = process.env.DEPLOY_RESULT === 'success';
            const pageUrl = String(process.env.PAGE_URL || '').replace(/\/?$/, '/');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const old = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
            let body;
            if (process.env.CLOSED === 'true') {
              if (!old) return;
              body = [marker, '### 🔍 テスト版(この PR のプレビュー)', '', 'PR を閉じたので、プレビューは公開サイトから外しました。', `- 実行結果: ${process.env.RUN_URL}`].join('\n');
            } else if (deployed && mine && mine.status === 'ok') {
              const url = `${pageUrl}pr/${pr}/`;
              // 公開された preview.json の commit を確かめる(Pages の反映を少し待つ)
              let live = null;
              for (let i = 0; i < 12 && !live; i++) {
                try {
                  const r = await fetch(`${url}preview.json?t=${Date.now()}`, { cache: 'no-store' });
                  if (r.ok) { const j = await r.json(); if (j.sha === mine.sha) live = j; }
                } catch (e) {}
                if (!live) await new Promise(r => setTimeout(r, 10000));
              }
              body = [marker, '### 🔍 テスト版を開く(この PR のプレビュー)',
                `- 通常プレイ: ${url}`,
                `- テストモード: ${url}?dev=1`,
                `- 対象コミット: \`${mine.sha}\`(画面の上端の帯にも 7 桁で出ます)`,
                `- 公開の確認: ${live ? '✅ 公開されたプレビューの commit が一致しました' : '⚠️ まだ反映を確かめられていません。数分後に開き、上端の帯の 7 桁を確かめてください'}`,
                `- 実行結果: ${process.env.RUN_URL}`,
                '', 'main の公開版とは別物です。プレビューのセーブ・設定は公開版と分けてあります。'].join('\n');
            } else {
              const why = !deployed ? '公開に失敗しました(実行結果を見てください)'
                : !mine ? 'この PR のプレビューは載っていません(上限を超えたか、PR の一覧を取れませんでした)'
                : mine.reason || mine.status;
              body = [marker, '### ⚠️ この PR のプレビューはまだ使えません',
                `- 対象コミット: \`${mine ? mine.sha : '(不明)'}\``,
                `- 状態: ${why}`,
                `- 実行結果: ${process.env.RUN_URL}`].join('\n');
            }
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
